services:
  postgres:
    image: postgres:15-alpine
    container_name: nt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: network_toolbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Taipei
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nt_network

  adminer:
    image: adminer:latest
    container_name: nt-adminer
    restart: unless-stopped
    ports:
      - "9090:8080"  # 改用 9092 避免與 Prometheus 衝突
    depends_on:
      - postgres
    networks:
      - nt_network

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nt-django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - TZ=Asia/Taipei
      - DEBUG=1
      - DB_HOST=postgres # 使用 Docker 內的 PostgreSQL 服務
      - DB_PORT=5432
      - DB_NAME=network_toolbox
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - NAS_MOUNT_PATH=/mnt/mdt  # NAS 掛載路徑
    volumes:
      - ./backend:/app
      - ./library:/app/library
      - ./logs:/app/logs # 日誌目錄掛載
      - static_files:/app/static
      - media_files:/app/media
      # NAS 掛載（如果 /mnt/mdt 存在的話）- 唯讀模式
      # - /mnt/mdt:/mnt/mdt:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - nt_network

  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nt-react
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - nt_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nt-nginx
    restart: unless-stopped
    volumes:
      - static_files:/app/static:ro
      - media_files:/app/media:ro
    ports:
      - "80:80"  # 改回 80 端口
    depends_on:
      - django
      - react
    networks:
      - nt_network

  # ==================== Celery 相關服務 ====================
  redis:
    image: redis:7-alpine
    container_name: nt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nt-celery-beat
    restart: unless-stopped
    command: celery -A network_toolbox beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - TZ=Asia/Taipei
      - DEBUG=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=network_toolbox
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - ./library:/app/library
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - django
    networks:
      - nt_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nt-celery-worker
    restart: unless-stopped
    command: celery -A network_toolbox worker --loglevel=info --concurrency=2
    environment:
      - TZ=Asia/Taipei
      - DEBUG=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=network_toolbox
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - ./library:/app/library
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - django
    networks:
      - nt_network

  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nt-celery-flower
    restart: unless-stopped
    command: celery -A network_toolbox flower --port=5555
    environment:
      - TZ=Asia/Taipei
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - nt_network

volumes:
  postgres_data:
  static_files:
  media_files:
  redis_data:  # Redis 資料持久化


networks:
  nt_network:
    driver: bridge
